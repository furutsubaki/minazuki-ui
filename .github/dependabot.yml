version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/playground/vue'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/playground/nuxt3'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/playground/nuxt4'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
