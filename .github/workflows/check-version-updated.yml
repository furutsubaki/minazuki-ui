name: Check Version Updated
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version_diff:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.get_diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: マージ先を取得
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: バージョンの変更を保持する
        id: get_diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: echo "changed=$(git diff "origin/$BASE_REF" HEAD --relative "./package.json" | grep "^+.\+version" | wc -l)" >> $GITHUB_OUTPUT

  version_check:
    runs-on: ubuntu-latest
    needs: [version_diff]
    if: needs.version_diff.outputs.changed == '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: バージョン更新を要求する
        run: |
          echo "::error::package.json version update required."
          exit 1
