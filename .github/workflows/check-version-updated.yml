name: Check Version Updated
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version_diff:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.get_diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: マージ先を取得
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: バージョンの変更を保持する
        id: get_diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: echo "changed=$(git diff "origin/$BASE_REF" HEAD --relative "./package.json" | grep "^+.\+version" | wc -l)" >> $GITHUB_OUTPUT

  version_check:
    runs-on: ubuntu-latest
    needs: [version_diff]
    if: needs.version_diff.outputs.changed == '0'
    steps:
      - name: バージョン更新を要求する
        run: |
          echo "::error::package.json version update required."
          exit 1
