name: Check the source code
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
jobs:
  lint:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          COREPACK_INTEGRITY_KEYS: 0

      - name: Enable corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: npm module install
        run: pnpm i --frozen-lockfile

      - name: Run Build
        run: pnpm build

      - name: Run linter
        run: pnpm lint

  test:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          COREPACK_INTEGRITY_KEYS: 0

      - name: Enable corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: npm module install
        run: pnpm i --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Check test results file
        if: always()
        run: |
          if [ -f test-results/junit.xml ]; then
            echo "✓ junit.xml found"
            ls -la test-results/
          else
            echo "✗ junit.xml not found"
            find . -name "junit.xml" 2>/dev/null || echo "No junit.xml files found"
          fi

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: 'test-results/junit.xml'
          reporter: 'java'
          fail-on-error: false
